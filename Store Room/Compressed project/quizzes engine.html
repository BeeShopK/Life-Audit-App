<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LifeApp Quizzes</title>
<link rel="stylesheet" href="quizzes.css">
</head>
<body class="quiz-page">

<div class="container">

  <!-- Quiz Cards -->
  <div class="quiz-hub-grid" id="quizGrid"></div>

  <!-- Quiz Modal -->
  <div class="quiz-wrap" id="quizWrap" style="display:none;">
    <div class="quiz-nav">
      <button class="btn-ghost" id="backQuiz">Back</button>
      <div class="quiz-progress-outer">
        <div class="quiz-progress-track">
          <div class="quiz-progress-fill" id="quizProgress"></div>
        </div>
        <div class="quiz-progress-text" id="progressText">0 / 0</div>
      </div>
    </div>

    <div class="question-card" id="questionCard">
      <div class="q-num" id="qNumber">Question 1</div>
      <div class="q-text" id="qText"></div>
      <div class="options-grid" id="optionsGrid"></div>
    </div>

    <div class="results-card" id="resultsCard" style="display:none;">
      <div class="results-label">Your Score</div>
      <div class="results-score-ring">
        <div class="ring-score" id="scoreRing">0 / 0</div>
      </div>
      <div class="results-desc" id="resultsDesc"></div>
      <button class="btn-primary" id="retryBtn">Retry Quiz</button>
    </div>

  </div>

</div>

<script src="quizzes.js"></script>
</body>
</html>
